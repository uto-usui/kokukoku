<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tinted: grayscale. iOS applies user's tint color as overlay. -->
  <!-- White bg + black shape = system masks and tints automatically -->
  <rect width="1024" height="1024" rx="224" fill="#FFFFFF"/>
  <path d="M 512 232 A 280 280 0 1 1 232 512"
        fill="none" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <line x1="512" y1="512" x2="232" y2="512"
        stroke="#000000" stroke-width="18" stroke-linecap="round"/>
</svg>
