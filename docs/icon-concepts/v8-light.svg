<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 135° warm gradient: top-left light → bottom-right deeper -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"
                    gradientTransform="rotate(-0)">
      <stop offset="0%" stop-color="#F6F4F1"/>
      <stop offset="100%" stop-color="#E6E3DF"/>
    </linearGradient>
    <!-- Subtle grain texture via SVG filter -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <!-- Alpha gradient for stroke: 100% at arc start → 88% at arc end -->
    <linearGradient id="strokeFade" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <!-- Background with warm gradient + grain -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)" filter="url(#grain)" opacity="0.97"/>
  <!-- Clean background underneath for grain blending -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)" style="mix-blend-mode: normal;" opacity="0.97"/>
  <!-- 270° arc: 12 o'clock → CW → 9 o'clock -->
  <path d="M 512 232 A 280 280 0 1 1 232 512"
        fill="none" stroke="url(#strokeFade)" stroke-width="18" stroke-linecap="round"/>
  <!-- Line from center to 9 o'clock -->
  <line x1="512" y1="512" x2="232" y2="512"
        stroke="#1A1A1A" stroke-width="18" stroke-linecap="round" stroke-opacity="0.88"/>
</svg>
